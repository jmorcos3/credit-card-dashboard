name: Weekly RSS Scraper

on:
  schedule:
    - cron: '0 13 * * 1'  # Mondays 9am ET (13:00 UTC)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install feedparser

      - name: Run RSS scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scrape.py

      - name: Run Gmail scraper
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: python scrape_email.py

      # A successful run of this workflow triggers "Deploy to GitHub Pages" (workflow_run).
      - name: Commit data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add offers.json offers_email.json history/
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore: weekly offers refresh [skip ci]"
          # Rebase + retry in case something else pushed while the scraper ran.
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase origin master && git push; then
              pushed=true
              break
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 3
          done
          if [ "$pushed" != true ]; then
            echo "::error::Could not push the refreshed data after 3 attempts"
            exit 1
          fi

      - name: Open this week's digest issue and close older ones
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const data = JSON.parse(fs.readFileSync('high_signal.json', 'utf-8'));
            if (!data.items || data.items.length === 0) {
              console.log('No high-signal items, skipping issue.');
              return;
            }

            const previous = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, labels: 'digest', state: 'open', per_page: 100,
            });

            const today = new Date().toISOString().slice(0, 10);
            const lines = data.items.map(i =>
              `### [${i.score}/10] ${i.title}\n` +
              `**Source:** ${i.source}${i.published ? ' · ' + new Date(i.published).toDateString() : ''}\n\n` +
              `${i.summary}\n\n` +
              `[Read more →](${i.link})\n\n---`
            );
            const body = `Weekly digest of high-signal credit card offers (score ≥ 7).\n\n` +
                         `Auto-generated by scrape.py on ${today}.\n\n---\n\n` +
                         lines.join('\n\n');
            await github.rest.issues.create({
              owner, repo,
              title: `Weekly Card Digest — ${today} (${data.items.length} high-signal)`,
              body,
              labels: ['digest'],
            });
            console.log(`Created issue with ${data.items.length} items.`);

            // Each digest supersedes the last; leaving them all open just piles up.
            for (const issue of previous) {
              if (issue.pull_request) continue;
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'not_planned',
              });
            }
            console.log(`Closed ${previous.length} superseded digest issue(s).`);
